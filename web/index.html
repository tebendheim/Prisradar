<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#102b36"><title>PrisRadar</title><link rel="manifest" href="./manifest.webmanifest"><style>body{font:16px system-ui;background:#f1f5f5;color:#102b36;max-width:800px;margin:auto;padding:20px}section,article{background:white;padding:18px;border-radius:14px;margin:12px 0}input,button{font:inherit;padding:12px;border:1px solid #b7c7cb;border-radius:8px;box-sizing:border-box;margin:4px 0}input{width:100%}button{background:#12645e;color:white;cursor:pointer}a{color:#12645e}small{display:block;color:#53676d}[hidden]{display:none!important}h1{letter-spacing:-1px}#status{white-space:pre-wrap}</style><h1>PrisRadar</h1><p>Finn den laveste dokumenterte kjøpsprisen.</p><section id="login"><form id="loginForm"><label>E-post<input id="email" type="email" required autocomplete="username"></label><label>Passord<input id="password" type="password" required autocomplete="current-password"></label><button>Logg inn</button></form></section><section id="app" hidden><button id="logout">Logg ut</button><form id="searchForm"><label>Produktnavn, EAN eller modell<input id="q" required maxlength="200"></label><button>Søk i produktindeksen</button></form><div id="results"></div><button id="coupons">Vis rabattkoder</button><div id="discounts"></div><h2>Prisvarsler</h2><form id="watchForm"><label>Produkt<input id="watchQuery" maxlength="200" required></label><label>Makspris inkl. frakt<input id="target" type="number" min="1" required></label><button>Lagre prisønske</button></form><div id="watches"></div></section><p id="status" role="status"></p><script type="module" src="./app.js"></script></html>
